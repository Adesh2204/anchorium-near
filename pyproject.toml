[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "anchorium-near"
version = "0.1.0"
description = "Autonomous trading agent with an on-chain NEAR risk guard and NEAR Intents 1Click settlement"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    # Pinned to the vendored strategy's source pins (vendor/anchorium_strategy/requirements.txt)
    "numpy==2.5.2",
    "pandas==3.0.5",
    "python-dotenv==1.2.3",
    # NEAR + 1Click
    "near-kit==1.3.0",   # Python NEAR client listed at docs.near.org/tools/near-api (imported as `near`)
    "httpx==0.28.1",
    # Dashboard
    "fastapi==0.121.1",
    "uvicorn==0.38.0",
]

[project.optional-dependencies]
dev = ["pytest==8.4.1"]

[tool.setuptools.packages.find]
include = ["anchorium*", "dashboard*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["network: hits a real public API (opt-in: pytest -m network)"]
addopts = "-m 'not network'"

[tool.ruff]
line-length = 120
extend-exclude = ["vendor"]

[tool.ruff.lint]
# Pinned to the classic default rule set: ruff >= 0.17 enables many more rules by default.
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
exclude = ["vendor/"]
