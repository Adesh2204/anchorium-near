[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "anchorium-near"
version = "0.1.0"
description = "Autonomous trading agent with an on-chain NEAR risk guard and NEAR Intents 1Click settlement"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    # Pinned to the vendored strategy's source pins (vendor/anchorium_strategy/requirements.txt)
    "numpy==2.5.2",
    "pandas==3.0.5",
    "python-dotenv==1.2.3",
]

[project.optional-dependencies]
dev = ["pytest==8.4.1"]

[tool.setuptools.packages.find]
include = ["anchorium*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: hits a real public API (opt-in: pytest -m network)"]
addopts = "-m 'not network'"
