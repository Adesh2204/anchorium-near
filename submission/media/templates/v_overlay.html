<!doctype html>
<!-- Transparent 1920x1080 overlay for the silent video: source label (top-left), speed badge (top-right) and a
     caption (bottom centre, white on 70% black, max 2 lines). Filled by web/assemble.py via the query string. -->
<html><head><meta charset="utf-8"><link rel="stylesheet" href="video.css">
<style>
  html, body { background: transparent !important; }
  .grid-bg, .rail { display: none; }
  .label { position: absolute; left: 192px; top: 24px; display: inline-flex; align-items: center; gap: 12px;
           font-family: var(--mono); font-size: 24px; color: var(--muted); background: rgba(23,27,33,.92);
           border: 1px solid var(--line); border-radius: 999px; padding: 9px 20px; }
  .label i { width: 12px; height: 12px; border-radius: 50%; display: block; }
  .badge { position: absolute; right: 192px; top: 24px; font-family: var(--mono); font-weight: 800; font-size: 26px;
           color: #0f1216; background: var(--blue); border-radius: 10px; padding: 8px 16px; }
  .cap { position: absolute; left: 50%; bottom: 22px; transform: translateX(-50%); max-width: 1560px; width: max-content;
         text-align: center; font-size: 34px; font-weight: 600; line-height: 1.3; color: #fff;
         background: rgba(0,0,0,.7); border-radius: 12px; padding: 12px 26px; }
</style></head>
<body>
  <div id="root"></div>
  <script>
    const q = new URLSearchParams(location.search), root = document.getElementById('root');
    const dot = {ok: 'var(--ok)', bad: 'var(--bad)', warn: 'var(--warn)', blue: 'var(--blue)', muted: 'var(--muted)'};
    if (q.get('label')) root.insertAdjacentHTML('beforeend',
      `<div class="label"><i style="background:${dot[q.get('dot') || 'muted']}"></i></div>`),
      root.lastChild.append(q.get('label'));
    if (q.get('badge')) { const b = document.createElement('div'); b.className = 'badge'; b.textContent = q.get('badge'); root.append(b); }
    if (q.get('cap')) { const c = document.createElement('div'); c.className = 'cap'; c.textContent = q.get('cap'); root.append(c); }
  </script>
</body></html>
