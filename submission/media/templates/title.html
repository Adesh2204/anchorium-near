<!doctype html>
<!-- Shot 2: title card, then the three problem cards. 1920x1080. Explanatory graphic: no metrics.
     ?still=1 renders the final state (used for the checkpoint still and the gallery); otherwise it animates
     and web/render.py records it. Timeline: rail draws 0-0.9 s, title 0.2 s, tagline 0.8 s, cards 4.0/5.2/6.4 s. -->
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="base.css">
<style>
  :root { --w: 1920px; --h: 1080px; }
  .wrap { position: absolute; inset: 0 0 var(--rail) 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .eyebrow { font-family: var(--mono); font-size: 22px; letter-spacing: .3em; color: var(--muted); }
  h1 { margin-top: 18px; font-size: 168px; font-weight: 800; letter-spacing: -.035em; line-height: 1; }
  .tag { margin-top: 26px; font-size: 40px; color: var(--muted); }
  .cards { margin-top: 84px; display: flex; gap: 28px; }
  .card { width: 470px; padding: 34px 36px; }
  .card .k { font-family: var(--mono); font-size: 18px; color: var(--muted); letter-spacing: .14em; }
  .card .t { margin-top: 14px; font-size: 34px; font-weight: 700; line-height: 1.2; }
  .anim h1 { animation: rise 700ms .2s cubic-bezier(.2, .7, .2, 1) both; }
  .anim .eyebrow { animation: fade 700ms .1s both; }
  .anim .tag { animation: fade 700ms .8s both; }
  .anim .card:nth-child(1) { animation: rise 600ms 4.0s cubic-bezier(.2, .7, .2, 1) both; }
  .anim .card:nth-child(2) { animation: rise 600ms 5.2s cubic-bezier(.2, .7, .2, 1) both; }
  .anim .card:nth-child(3) { animation: rise 600ms 6.4s cubic-bezier(.2, .7, .2, 1) both; }
  @keyframes rise { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: none; } }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
</style></head>
<body>
  <div class="wrap">
    <div class="eyebrow">BUILT AT NEAR HACKATHON</div>
    <h1>Anchorium</h1>
    <div class="tag">A trading bot you don't have to trust.</div>
    <div class="cards">
      <div class="card panel"><div class="k">PROBLEM 1</div><div class="t">Bots hold your keys</div></div>
      <div class="card panel"><div class="k">PROBLEM 2</div><div class="t">Broken rules stay invisible</div></div>
      <div class="card panel"><div class="k">PROBLEM 3</div><div class="t">Track records are screenshots</div></div>
    </div>
  </div>
  <div class="rail muted"></div>
  <script>if (!new URLSearchParams(location.search).has('still')) document.body.classList.add('anim');</script>
</body></html>
